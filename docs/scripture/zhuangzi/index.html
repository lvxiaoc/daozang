    <h1>庄子</h1>
    <div class="scripture-content">

            <div class="chapter" id="chapter-0">
                <h2>第一章：逍遥游</h2>
                <div class="chapter-text">
                    <pre>北冥有鱼，其名为鲲。鲲之大，不知其几千里也。化而为鸟，其名为鹏。鹏之背，不知其几千里也；怒而飞，其翼若垂天之云。是鸟也，海运则将徙于南冥。南冥者，天池也。

《齐谐》者，志怪者也。之言曰：“鹏之徙于南冥也，水击三千里，抟扶摇而上者九万里，去以六月息者也。”野马也，尘埃也，生物之以息相吹也。天之苍苍，其正色邪？其远而无所至极邪？其视下也，亦若是则已矣。</pre>
