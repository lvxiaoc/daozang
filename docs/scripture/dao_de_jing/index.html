    <h1>道德经</h1>
    <div class="scripture-content">

            <div class="chapter" id="chapter-0">
                <h2>第一章</h2>
                <div class="chapter-text">
                    <pre>道可道，非常道。名可名，非常名。
无名，天地之始；有名，万物之母。
故常无欲，以观其妙；常有欲，以观其徼。
此两者，同出而异名，同谓之玄。玄之又玄，众妙之门。</pre>
                </div>
            </div>

            <div class="chapter" id="chapter-1">
                <h2>第二章</h2>
                <div class="chapter-text">
                    <pre>天下皆知美之为美，斯恶已。皆知善之为善，斯不善已。
有无相生，难易相成，长短相形，高下相倾，音声相和，前后相随。恒也。
是以圣人处无为之事，行不言之教；万物作而不辞，生而不有，为而不恃，功成而弗居。
夫唯弗居，是以不去。</pre>
                </div>
            </div>

    </div>
